    <style>:root{--bg:#0f1117;--panel:#161922;--line:#252a36;--text:#eef1f4;--muted:#8b8f99;--accent:#7fd4b0;--a:#7aa2ff;--b:#ff8a7a;--sans:system-ui, -apple-system, "Segoe UI", sans-serif;--mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--text);font:14px/1.5 var(--sans);margin:0;overflow:hidden}a{color:inherit}#view{touch-action:none;width:100%;height:100%;position:fixed;inset:0}body.dropping #view{outline:2px dashed var(--accent);outline-offset:-10px}.brand{font:600 16px var(--mono);text-decoration:none;position:fixed;top:16px;left:20px}.brand span{color:var(--muted);font-weight:400}.panel{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);background:#161922d9;border-radius:14px;gap:14px;width:330px;max-height:calc(100% - 28px);padding:16px;display:grid;position:fixed;top:14px;right:14px;overflow-y:auto}.panel h2{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}select{width:100%;font:13px var(--mono);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}.note{color:var(--muted);margin-top:6px;font-size:12px}.note:empty{display:none}.chips{flex-wrap:wrap;gap:6px;display:flex}button{font:inherit;color:var(--muted);border:1px solid var(--line);cursor:pointer;background:0 0;border-radius:999px;padding:4px 9px;font-size:13px}button:hover{color:var(--text)}button[aria-pressed=true]{color:var(--bg);background:var(--text);border-color:var(--text)}button.done{color:var(--accent);border-color:var(--accent)}.readout{font:12px/1.6 var(--mono);color:var(--muted)}.readout code{font:inherit;color:var(--text)}.keys{font:12px var(--mono);color:var(--muted);gap:14px;display:flex}.key:before{content:"";border:1.5px solid var(--c);background:color-mix(in srgb, var(--c) 25%, transparent);border-radius:2px;width:9px;height:9px;margin-right:6px;display:inline-block}.key.result:before{background:color-mix(in srgb, var(--c) 60%, transparent)}.help{color:var(--muted);margin:0;padding:0;font-size:12px;list-style:none}.help b{color:var(--text);font-weight:500}kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px}.coords{font:11px var(--mono);color:var(--muted);pointer-events:none;position:fixed;bottom:14px;left:20px}@media (width<=760px){.panel{gap:10px;width:auto;max-height:46%;padding:12px;inset:auto 10px 10px}.help,.coords{display:none}}</style>
    <script type="module" crossorigin src="./assets/playground-D0Dw5bV1.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-ByFubjJL.js">
    <link rel="modulepreload" crossorigin href="./assets/shared-NrTixoTb.js">
    <link rel="modulepreload" crossorigin href="./assets/case-data-Bc-K1eTg.js">
  </head>
  <body>
    <canvas id="view" aria-label="Polygons A and B and the result of the operation"></canvas>
    <a class="brand" href="./">martinez <span>playground</span></a>

    <aside class="panel" id="panel">
      <div>
        <h2>Case</h2>
        <select id="case" aria-label="Test case"></select>
        <div class="note" id="note"></div>
      </div>
      <div>
        <h2>Operation</h2>
        <div class="chips" role="group" aria-label="Operation">
          <button data-op="union" aria-pressed="false">A ∪ B</button>
          <button data-op="intersection" aria-pressed="true">A ∩ B</button>
          <button data-op="diff" aria-pressed="false">A − B</button>
          <button data-op="diff_ba" aria-pressed="false">B − A</button>
          <button data-op="xor" aria-pressed="false">A ⊕ B</button>
        </div>
      </div>
      <div>
        <h2>Result</h2>
        <div class="readout" id="readout">&nbsp;</div>
      </div>
      <div class="keys">
        <span class="key" style="--c: var(--a)">A</span>
        <span class="key" style="--c: var(--b)">B</span>
        <span class="key result" style="--c: var(--accent)">result</span>
      </div>
      <div class="chips">
        <button id="fit">fit</button>
        <button id="swap">swap A ↔ B</button>
        <button id="reset">reset</button>
        <button
          id="copy-input"
          title="A and B as a GeoJSON FeatureCollection, the format of the test cases"
        >
          copy A, B
        </button>
        <button id="copy-result" title="The result as a GeoJSON Feature">copy result</button>
      </div>
      <ul class="help">
        <li><b>Drag</b> a shape or a vertex; drag the background to pan, scroll to zoom</li>
        <li><b>Double-click</b> an edge to add a vertex, a vertex to remove it</li>
        <li><b>Paste</b> or <b>drop</b> GeoJSON: the first two polygons become A and B</li>
        <li>
          <kbd>1</kbd>–<kbd>5</kbd> operation · <kbd>←</kbd> <kbd>→</kbd> case · <kbd>F</kbd> fit
        </li>
      </ul>
    </aside>
    <div class="coords" id="coords"></div>

  </body>
</html>
